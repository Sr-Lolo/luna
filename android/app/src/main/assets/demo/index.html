<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
:root{--bg:#0D0D0D;--bg-elevated:#1E1E1E;--bg-tertiary:#111;--border:#2A2A2A;--border-light:#333;--text:#E0E0E0;--text-strong:#FFF;--text-muted:#888;--accent:#4FC3F7;--accent-bg:#1A2A33;--danger:#F44336;--danger-bg:#2A1A1A;--success:#4CAF50;--success-bg:#1A2A1A;--spring:cubic-bezier(0.34,1.56,0.64,1)}
[data-theme="light"]{--bg:#F0F0F0;--bg-elevated:#FAFAFA;--bg-tertiary:#E8E8E8;--border:#D0D0D0;--border-light:#BBBBBB;--text:#222222;--text-strong:#111;--text-muted:#888;--accent:#0288D1;--accent-bg:#B3E5FC;--danger:#D32F2F;--danger-bg:#FFEBEE;--success:#388E3C;--success-bg:#E8F5E9}
html,body{height:100%;margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#canvas{height:100%;padding:6px;display:grid;gap:6px;align-content:stretch;overflow:hidden;grid-auto-rows:1fr}
button{aspect-ratio:auto;width:100%;height:100%;background:var(--bg-elevated);border:1px solid var(--border-light);border-radius:clamp(6px,1.5vw,12px);font-size:clamp(7px,calc(44px / var(--cols)),16px);font-weight:700;cursor:pointer;touch-action:manipulation;overflow:hidden;transition:background .15s var(--spring),transform .15s var(--spring);box-shadow:0 4px 8px rgba(0,0,0,.4);color:var(--text-strong);outline:none;position:relative;animation:btn-enter .35s var(--spring) backwards;animation-delay:calc(var(--i) * .03s)}
button:active{background:var(--border-light);transform:scale(0.95);box-shadow:inset 0 0 14px rgba(0,229,255,.35);transition-duration:.05s}
button.empty{background:transparent;border:1px dashed var(--border);color:transparent;pointer-events:none;box-shadow:none}
button.mod{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-size:clamp(5px,calc(30px / var(--cols)),11px)}
button.special{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
button.arrow{background:var(--success-bg);border-color:var(--success);color:var(--success)}
@keyframes btn-enter{from{opacity:0;transform:translateY(16px) scale(.92)}}
</style>
</head>

<div id="canvas"></div>

var activePointers={}
function sendKeyTap(k,m){if(navigator.vibrate)navigator.vibrate(8)}
function sendKeyPress(k,m,p){if(navigator.vibrate)navigator.vibrate(8);activePointers[p]={key:k,mods:m}}
function sendKeyRelease(k,m,p){delete activePointers[p]}
function releaseAllPointers(){activePointers={}}
function getDisplayDims(c){if(c===5)return{cols:7,rows:3,total:21};if(c===6)return{cols:6,rows:4,total:24};return{cols:4,rows:4,total:16}}
function renderButtons(){canvas.innerHTML='';if(!profiles||!profiles[currentProfile])return;var profile=profiles[currentProfile];var cols=profile.cols||4;var keys=profile.keys||[];var dims=getDisplayDims(cols);canvas.style.gridTemplateColumns='repeat('+dims.cols+',1fr)';canvas.style.gridTemplateRows='repeat('+dims.rows+',1fr)';canvas.style.setProperty('--cols',dims.cols);for(var i=0;i<dims.total;i++){if(i<keys.length){var btn=keys[i];var el=document.createElement('button');var iconUrl=null;if(btn.icon&&btn.icon.startsWith('custom/')){iconUrl='/custom-icons/'+btn.icon.replace('custom/','')}else if(btn.icon){iconUrl='/icons/'+btn.icon+'.png'}else if(ICON_MAP[btn.label]){iconUrl='/icons/'+ICON_MAP[btn.label]+'.png'}if(iconUrl){var img=document.createElement('img');img.src=iconUrl;img.className='btn-icon';img.alt=btn.label;img.draggable=false;el.appendChild(img)}else{el.textContent=btn.label}if(btn.cls)el.className=btn.cls;el.style.setProperty('--i',i);if(btn.mods){el.addEventListener('pointerdown',(function(b){return function(e){e.preventDefault();if(navigator.vibrate)navigator.vibrate(8);sendKeyTap(b.key,b.mods)}})(btn))}else{el.addEventListener('pointerdown',(function(b){return function(e){e.preventDefault();e.target.setPointerCapture(e.pointerId);if(navigator.vibrate)navigator.vibrate(8);sendKeyPress(b.key,b.mods,e.pointerId)}})(btn));el.addEventListener('pointerup',(function(b){return function(e){sendKeyRelease(b.key,b.mods,e.pointerId)}})(btn));el.addEventListener('pointercancel',(function(b){return function(e){sendKeyRelease(b.key,b.mods,e.pointerId)}})(btn))}canvas.appendChild(el)}else{var el=document.createElement('button');el.className='empty';canvas.appendChild(el)}}}
